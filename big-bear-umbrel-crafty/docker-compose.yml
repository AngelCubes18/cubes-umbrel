version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: big-bear-umbrel-crafty_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.10.3
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
      - APP_PASSWORD=$APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/config:/app/config
      - ${APP_DATA_DIR}/data/backups:/crafty/backups
      - ${APP_DATA_DIR}/data/logs:/crafty/logs
      - ${APP_DATA_DIR}/data/servers:/crafty/servers
      - ${APP_DATA_DIR}/data/config:/crafty/app/config
      - ${APP_DATA_DIR}/data/import:/crafty/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8443 >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
